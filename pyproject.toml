[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garces-tnep-reproduction"
version = "0.1.0"
description = "Reproducible bilevel transmission expansion planning models"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.12",
  "pyomo>=6.8",
  "highspy>=1.7",
]

[tool.setuptools.packages.find]
where = ["src"]

